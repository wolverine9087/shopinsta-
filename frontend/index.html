<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="description" content="A little marketplace for things you'll love, from the independent shops you'll want to tell everyone about." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    <title>ShopInsta — good finds, good feelings</title>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;display:grid;place-items:center;background:#fbfaf7;color:#273b32;font:15px system-ui,sans-serif">Loading ShopInsta…</div></div>
    <script>
      (() => {
        const showStartupError = (message) => {
          const root = document.getElementById('root')
          if (!root?.textContent.includes('Loading ShopInsta')) return
          root.replaceChildren()
          const panel = document.createElement('main')
          panel.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbfaf7;color:#273b32;font:15px system-ui,sans-serif'
          const text = document.createElement('p')
          text.style.cssText = 'max-width:640px;overflow-wrap:anywhere'
          text.textContent = `ShopInsta did not start: ${message}`
          panel.append(text)
          root.append(panel)
        }
        window.addEventListener('error', (event) => {
          if (event.message) showStartupError(event.message)
        })
        window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason?.message || event.reason || 'Unknown startup error'))
        window.setTimeout(() => showStartupError('The app script did not finish loading. Reload this page and check the Vite server.'), 15000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
